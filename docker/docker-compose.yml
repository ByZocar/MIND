name: acv-platform

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  image: acv-airflow:2.9.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-acv_admin}:${POSTGRES_PASSWORD:-change_me_in_local}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__WEBSERVER__SECRET_KEY: dev_secret_key_change_in_prod
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # ---- credenciales del DW (acv.config.Settings los toma como env vars) ----
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-acv}
    POSTGRES_USER: ${POSTGRES_USER:-acv_admin}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local}
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../src:/opt/project/src
    - ../sql:/opt/project/sql:ro
    - ../data/raw:/opt/project/data/raw:ro
    - ../reports:/opt/project/reports
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    container_name: acv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acv}
      POSTGRES_USER: ${POSTGRES_USER:-acv_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_local}
    # Mapped to 5433 on the host to avoid clashing with a native Postgres
    # service often installed on Windows. Inside the docker network it
    # still listens on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: acv-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "==> airflow db migrate"
        airflow db migrate
        echo "==> ensure admin user"
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin \
          --email admin@acv.local || true
        echo "==> init OK"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: acv-airflow-webserver
    command: webserver
    # 8088 on host to avoid collisions with other dev tools that grab 8080.
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: acv-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: acv-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    profiles: ["streaming"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: acv-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    profiles: ["streaming"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: acv-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    profiles: ["mlflow"]

volumes:
  pg_data:
  mlflow_data:
